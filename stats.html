<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
        }
        .refresh-btn {
            padding: 8px 16px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background: #66b1ff;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card-label {
            font-size: 14px;
            color: #909399;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 32px;
            font-weight: 600;
            color: #303133;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #e4e7ed;
            margin-bottom: 16px;
            gap: 8px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            color: #606266;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn.active {
            color: #409eff;
            border-bottom-color: #409eff;
            font-weight: 500;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 500;
            color: #606266;
        }
        tr:hover {
            background: #f5f7fa;
        }
        .loading, .empty {
            text-align: center;
            color: #909399;
            padding: 30px;
        }
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            h1 {
                font-size: 20px;
            }
            .card-value {
                font-size: 26px;
            }
            th, td {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>数据监控面板</h1>
            <button id="refreshBtn" class="refresh-btn">刷新数据</button>
        </header>

        <div class="stats-cards">
            <div class="card">
                <div class="card-label">总访问量</div>
                <div class="card-value" id="totalVisit">--</div>
            </div>
            <div class="card">
                <div class="card-label">今日访问量</div>
                <div class="card-value" id="todayVisit">--</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="ping">优质测速记录</button>
            <button class="tab-btn" data-tab="ip">访客IP记录</button>
        </div>

        <div class="tab-content">
            <div class="tab-pane active" id="ping-tab">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>站点名称</th>
                                <th>延迟(ms)</th>
                                <th>丢包率</th>
                                <th>记录时间</th>
                            </tr>
                        </thead>
                        <tbody id="pingTable">
                            <tr><td colspan="4" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane" id="ip-tab">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>IP地址</th>
                                <th>首次访问</th>
                                <th>最后访问</th>
                                <th>访问次数</th>
                            </tr>
                        </thead>
                        <tbody id="ipTable">
                            <tr><td colspan="4" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 标签切换
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`${tab}-tab`).classList.add('active');
            });
        });

        // 加载访问统计
        async function loadStats() {
            try {
                const res = await fetch('/visit');
                const data = await res.json();
                document.getElementById('totalVisit').textContent = data.total || 0;
                document.getElementById('todayVisit').textContent = data.today || 0;
            } catch (e) {
                document.getElementById('totalVisit').textContent = '加载失败';
                document.getElementById('todayVisit').textContent = '加载失败';
            }
        }

        // 加载测速记录
        async function loadPingList() {
            const tbody = document.getElementById('pingTable');
            try {
                const res = await fetch('/list');
                const list = await res.json();
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(item => `
                    <tr>
                        <td>${item.name || '-'}</td>
                        <td>${item.ms || '-'}</td>
                        <td>${item.loss || 0}%</td>
                        <td>${item.time || '-'}</td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">加载失败</td></tr>';
            }
        }

        // 加载IP记录
        async function loadIpList() {
            const tbody = document.getElementById('ipTable');
            try {
                const res = await fetch('/ip-list');
                const list = await res.json();
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(item => `
                    <tr>
                        <td>${item.ip || '-'}</td>
                        <td>${item.firstTime || '-'}</td>
                        <td>${item.lastTime || '-'}</td>
                        <td>${item.count || 0}</td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="loading">加载失败</td></tr>';
            }
        }

        // 刷新全部数据
        function refreshAll() {
            loadStats();
            loadPingList();
            loadIpList();
        }

        document.getElementById('refreshBtn').addEventListener('click', refreshAll);

        // 页面加载自动获取数据
        refreshAll();
    </script>
</body>
</html>
