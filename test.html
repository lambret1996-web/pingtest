<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ping全自动延迟测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F2F2F7; --card-bg: #FFFFFF; --card-border: #E5E5EA;
    --text-primary: #1C1C1E; --text-secondary: #3C3C43; --text-tertiary: #8E8E93;
    --green: #34C759; --orange: #FF9500; --red: #FF3B30; --blue: #007AFF; --purple: #AF52DE; --gray: #8E8E93;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text-primary); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  .app-container {
    width: 100%; max-width: 430px; height: 100vh; height: 100dvh; margin: 0 auto;
    background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  @media (min-width: 431px) {
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; }
    .app-container { height: 90vh; max-height: 932px; border-radius: 40px; box-shadow: 0 25px 80px rgba(0,0,0,0.25); }
  }
  /* 标题 */
  .page-header { text-align: center; padding: 16px 16px 8px; flex-shrink: 0; }
  .page-title {
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, #007AFF 0%, #AF52DE 50%, #FF2D55 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px;
  }
  .page-subtitle { font-size: 12px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
  /* IP信息框 */
  .info-card {
    background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%); border: 1px solid rgba(0,122,255,0.1);
    border-radius: 18px; padding: 14px 16px; margin: 6px 14px 4px; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,122,255,0.08); position: relative; overflow: hidden;
  }
  .info-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #007AFF, #AF52DE, #FF2D55);
  }
  .ip-bar { display: flex; flex-direction: column; gap: 8px; }
  .ip-row { display: flex; align-items: center; font-size: 13px; color: var(--text-secondary); gap: 8px; }
  .ip-icon {
    width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .ip-icon.ip { background: rgba(0,122,255,0.1); }
  .ip-icon.isp { background: rgba(175,82,222,0.1); }
  .ip-icon.loc { background: rgba(255,45,85,0.1); }
  .ip-row .label { color: var(--text-tertiary); min-width: 60px; font-weight: 500; font-size: 12px; }
  .ip-row span.value { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; font-size: 13px; }
  .time-line {
    display: flex; align-items: center; font-size: 13px; color: var(--text-secondary);
    padding-top: 10px; border-top: 1px dashed rgba(0,122,255,0.15); margin-top: 2px; gap: 8px;
  }
  .time-line .ip-icon { background: rgba(52,199,89,0.1); }
  .time-line .label { color: var(--text-tertiary); min-width: 60px; font-weight: 500; font-size: 12px; }
  .time-line span.value { font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; font-size: 14px; }
  /* 监控状态条 */
  .monitor-bar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 16px 4px; font-size: 12px; color: var(--text-tertiary); font-weight: 500; flex-shrink: 0; }
  .monitor-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 0.05s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.7); } }
  /* 列表 */
  .list-container { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 4px 14px 0; overscroll-behavior: contain; }
  .list-container::-webkit-scrollbar { display: none; }
  /* 卡片 */
  .service-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px;
    padding: 14px 14px 10px; margin-bottom: 12px; position: relative; overflow: hidden;
    transition: transform 0.15s; cursor: pointer; animation: cardIn 0.4s ease-out both; min-height: 90px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .service-card:active { transform: scale(0.98); }
  @keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .card-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 2; }
  .site-header, .site-link { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .site-link { cursor: pointer; text-decoration: none; color: inherit; }
  .service-icon {
    width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden; background: #f5f5f5; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .service-icon img { width: 28px; height: 28px; object-fit: contain; display: block; }
  .service-info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .service-name { font-size: 16px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .service-tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
  .tag-domestic { color: var(--green); background: rgba(52,199,89,0.12); }
  .tag-international { color: var(--blue); background: rgba(0,122,255,0.12); }
  /* 渐变面积趋势线 */
  .card-bottom { display: flex; align-items: flex-end; margin-top: 2px; padding-left: 0; position: relative; z-index: 1; height: 2px; }
  .trend-chart { flex: 1; height: 44px; min-width: 0; }
  .trend-chart svg { width: 50%; height: 50%; display: block; overflow: visible; }
  .trend-area { stroke: none; }
  .trend-line { fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  .trend-dot { stroke: #fff; stroke-width: 2; }
  /* 延迟数值 */
  .latency-display { position: absolute; right: 14px; top: 28px; display: flex; align-items: baseline; z-index: 3; }
  .latency-value { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; transition: color 0.3s; }
  .latency-unit { font-size: 13px; font-weight: 600; margin-left: 2px; opacity: 0.7; transition: color 0.3s; }
  .latency-good { color: var(--green); }
  .latency-warning { color: var(--orange); }
  .latency-bad { color: var(--red); }
  .latency-offline { color: var(--gray); }
  /* 详情面板 */
  .card-detail { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, margin-top 0.3s ease-out; margin-top: 0; }
  .card-detail.open { max-height: 180px; margin-top: 12px; }
  .detail-content { border-top: 1px solid var(--card-border); padding-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail-item { display: flex; flex-direction: column; gap: 4px; }
  .detail-label { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
  .detail-value { font-size: 14px; color: var(--text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 页脚 */
  .list-footer { text-align: center; padding: 16px 0 calc(24px + var(--safe-bottom)); font-size: 12px; color: var(--text-tertiary); line-height: 1.8; }
  .visit-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 10px; }
  .visit-stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .visit-stat-num {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #007AFF, #AF52DE);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    font-variant-numeric: tabular-nums;
  }
  .visit-stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
  .footer-divider { width: 50px; height: 1px; background: var(--card-border); margin: 10px auto; }
  /* Toast */
  .toast {
    position: fixed; bottom: calc(40px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,0.8); color: #fff;
    padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app-container" id="app">
  <div class="page-header">
    <div class="page-title">Ping 延迟测试</div>
    <div class="page-subtitle">Real-time Network Monitor</div>
  </div>
  <div class="info-card">
    <div class="ip-bar">
      <div class="ip-row"><div class="ip-icon ip">🌐</div><span class="label">当前IP</span><span class="value" id="clientIp">获取中</span></div>
      <div class="ip-row"><div class="ip-icon isp">📡</div><span class="label">运营商</span><span class="value" id="isp">获取中</span></div>
      <div class="ip-row"><div class="ip-icon loc">📍</div><span class="label">位置</span><span class="value" id="location">获取中</span></div>
      <div class="time-line"><div class="ip-icon">⏰</div><span class="label">北京时间</span><span class="value" id="nowTime">--</span></div>
    </div>
  </div>
  <div class="monitor-bar"><span class="monitor-dot"></span><span>真实测速中 · 50ms 并发刷新</span></div>
  <div class="list-container" id="listContainer"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function() {
  'use strict';
  const UPDATE_INTERVAL = 50, DATA_POINTS = 56, TIMEOUT_MS = 3000;
  let isUpdating = false;
  const API_BASE = "";

  // 仅 GitHub 保留 siteUrl 跳转，其他站点 siteUrl 为 null
  const serviceConfigs = [
    { id:'wangzhe', name:'王者荣耀', region:'domestic', regionLabel:'国内', trendColor:'#34C759', iconUrl:'https://pvp.qq.com/favicon.ico', testUrl:'https://pvp.qq.com/favicon.ico', siteUrl:null },
    { id:'heping', name:'和平精英', region:'domestic', regionLabel:'国内', trendColor:'#34C759', iconUrl:'https://gp.qq.com/favicon.ico', testUrl:'https://gp.qq.com/favicon.ico', siteUrl:null },
    { id:'douyin', name:'抖音', region:'domestic', regionLabel:'国内', trendColor:'#34C759', iconUrl:'https://www.douyin.com/favicon.ico', testUrl:'https://www.douyin.com/favicon.ico', siteUrl:null },
    { id:'taobao', name:'淘宝', region:'domestic', regionLabel:'国内', trendColor:'#34C759', iconUrl:'https://www.taobao.com/favicon.ico', testUrl:'https://www.taobao.com/favicon.ico', siteUrl:null },
    { id:'cloudflare', name:'Cloudflare', region:'international', regionLabel:'国际', trendColor:'#FF9500', iconUrl:'https://www.cloudflare.com/favicon.ico', testUrl:'https://www.cloudflare.com/favicon.ico', siteUrl:null },
    { id:'github', name:'GitHub', region:'international', regionLabel:'国际', trendColor:'#FF9500', iconUrl:'https://github.com/favicon.ico', testUrl:'https://github.com/favicon.ico', siteUrl:'https://github.com' },
    { id:'chatgpt', name:'ChatGPT', region:'international', regionLabel:'国际', trendColor:'#FF3B30', iconUrl:'https://chat.openai.com/favicon.ico', testUrl:'https://chat.openai.com/favicon.ico', siteUrl:null },
    { id:'telegram', name:'Telegram', region:'international', regionLabel:'国际', trendColor:'#FF3B30', iconUrl:'https://web.telegram.org/favicon.ico', testUrl:'https://web.telegram.org/favicon.ico', siteUrl:null },
    { id:'xcom', name:'X', region:'international', regionLabel:'国际', trendColor:'#FF3B30', iconUrl:'https://x.com/favicon.ico', testUrl:'https://x.com/favicon.ico', siteUrl:null },
    { id:'youtube', name:'YouTube', region:'international', regionLabel:'国际', trendColor:'#FF3B30', iconUrl:'https://www.youtube.com/favicon.ico', testUrl:'https://www.youtube.com/favicon.ico', siteUrl:null }
  ];

  // IP信息
  (async function(){ try{ const r=await fetch("https://api.ip.sb/geoip"), d=await r.json();
    document.getElementById("clientIp").textContent=d.ip;
    document.getElementById("location").textContent=d.country+" "+(d.city||"");
    document.getElementById("isp").textContent=d.isp||"未知";
  }catch(e){ document.getElementById("clientIp").textContent="获取失败"; document.getElementById("location").textContent="获取失败"; document.getElementById("isp").textContent="获取失败"; }})();

  // 北京时间
  function updateBeijingTime(){ const n=new Date(), b=new Date(n.getTime()+8*3600*1000);
    const y=b.getUTCFullYear(), m=String(b.getUTCMonth()+1).padStart(2,'0'), d=String(b.getUTCDate()).padStart(2,'0'),
    h=String(b.getUTCHours()).padStart(2,'0'), mi=String(b.getUTCMinutes()).padStart(2,'0'), s=String(b.getUTCSeconds()).padStart(2,'0');
    document.getElementById("nowTime").innerText=y+"-"+m+"-"+d+" "+h+":"+mi+":"+s; }
  updateBeijingTime(); setInterval(updateBeijingTime,1000);

  // 访问统计
  async function reportVisit(){ try{ const r=await fetch(API_BASE+"/visit"), d=await r.json();
    const t=document.getElementById('visitTotal'), td=document.getElementById('visitToday');
    if(t)t.textContent=d.total||0; if(td)td.textContent=d.today||0;
  }catch(e){ const t=document.getElementById('visitTotal'), td=document.getElementById('visitToday'); if(t)t.textContent='--'; if(td)td.textContent='--'; }}

  // 真实测速
  function measureLatency(url){ return new Promise(function(resolve){
    const start=performance.now(), img=new Image(); let settled=false;
    img.onload=function(){ if(settled)return; settled=true; resolve(performance.now()-start); };
    img.onerror=function(){ if(settled)return; settled=true; const e=performance.now()-start; resolve(e>50?e:null); };
    img.src=url+'?t='+Date.now()+Math.random();
    setTimeout(function(){ if(settled)return; settled=true; resolve(null); }, TIMEOUT_MS);
  });}

  function initService(c){ return {...c, latency:null, trendData:[], level:'offline', failCount:0}; }
  function getLevel(l){ if(l===null)return'offline'; if(l<100)return'good'; if(l<300)return'warning'; return'bad'; }
  function calcJitter(d){ if(d.length<2)return 0; const m=d.reduce((a,b)=>a+b,0)/d.length; return Math.sqrt(d.reduce((s,v)=>s+Math.pow(v-m,2),0)/d.length); }

  const services=serviceConfigs.map(initService);
  let expandedCardId=null;
  const listContainer=document.getElementById('listContainer'), toast=document.getElementById('toast');

  // 渐变面积趋势线（平滑曲线+渐变填充+末端数据点，线宽1px）
  function generateTrendSVG(service, width, height){
    const data=service.trendData; if(data.length<2)return '';
    const pad=height*0.1, uh=height-pad*2, sx=width/(data.length-1);
    const min=Math.min(...data), max=Math.max(...data), range=max-min||1, gid='grad-'+service.id;
    const pts=data.map((v,i)=>({x:i*sx, y:pad+uh-((v-min)/range)*uh}));
    let lp='M '+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
    for(let i=1;i<pts.length;i++){ const p=pts[i-1],c=pts[i],cx=(p.x+c.x)/2; lp+=' Q '+cx.toFixed(1)+','+p.y.toFixed(1)+' '+c.x.toFixed(1)+','+c.y.toFixed(1); }
    const last=pts[pts.length-1], first=pts[0];
    const ap=lp+' L '+last.x.toFixed(1)+','+height+' L '+first.x.toFixed(1)+','+height+' Z';
    return '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+service.trendColor+'" stop-opacity="0.35"/>'+
      '<stop offset="100%" stop-color="'+service.trendColor+'" stop-opacity="0"/></linearGradient></defs>'+
      '<path class="trend-area" d="'+ap+'" fill="url(#'+gid+')"/>'+
      '<path class="trend-line" d="'+lp+'" stroke="'+service.trendColor+'" stroke-width="1"/>'+
      '<circle cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="6" fill="'+service.trendColor+'" opacity="0.25"/>'+
      '<circle class="trend-dot" cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="3.5" fill="'+service.trendColor+'"/>';
  }

  function animateNumber(el,from,to,dur){ if(from===null)from=0; const st=performance.now();
    function up(ct){ const p=Math.min((ct-st)/dur,1), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e); if(p<1)requestAnimationFrame(up);} requestAnimationFrame(up); }

  function renderCard(service, index){
    const card=document.createElement('div'); card.className='service-card'; card.dataset.id=service.id;
    card.style.animationDelay=(index*0.04)+'s';
    const lc='latency-'+service.level, tc=service.region==='domestic'?'tag-domestic':'tag-international';
    const svg=generateTrendSVG(service,DATA_POINTS-1,44), dv=service.latency===null?'--':Math.round(service.latency);
    const ht=service.siteUrl?'a':'div', ha=service.siteUrl?'href="'+service.siteUrl+'" target="_blank" rel="noopener noreferrer"':'';
    card.innerHTML='<div class="card-top"><'+ht+' class="'+(service.siteUrl?'site-link':'site-header')+'" '+ha+'>'+
      '<div class="service-icon"><img src="'+service.iconUrl+'" alt="'+service.name+'" onerror="this.style.display=\'none\'"></div>'+
      '<div class="service-info"><span class="service-name">'+service.name+'</span><span class="service-tag '+tc+'">'+service.regionLabel+'</span></div>'+
      '</'+ht+'></div>'+
      '<div class="card-bottom"><div class="trend-chart"><svg viewBox="0 0 '+(DATA_POINTS-1)+' 44" preserveAspectRatio="none">'+svg+'</svg></div></div>'+
      '<div class="latency-display"><span class="latency-value '+lc+'">'+dv+'</span><span class="latency-unit '+lc+'">ms</span></div>'+
      '<div class="card-detail" id="detail-'+service.id+'"><div class="detail-content">'+
        '<div class="detail-item"><span class="detail-label">网络波动</span><span class="detail-value" data-field="jitter">-- ms</span></div>'+
        '<div class="detail-item"><span class="detail-label">测速地址</span><span class="detail-value" style="font-size:11px;word-break:break-all;">'+service.testUrl+'</span></div>'+
        '<div class="detail-item"><span class="detail-label">平均延迟</span><span class="detail-value" data-field="avg">-- ms</span></div>'+
        '<div class="detail-item"><span class="detail-label">峰值/谷值</span><span class="detail-value" data-field="range">-- / -- ms</span></div>'+
      '</div></div>';
    card.addEventListener('click',function(e){ if(e.target.closest('.site-link'))return;
      const d=document.getElementById('detail-'+service.id);
      if(expandedCardId===service.id){ d.classList.remove('open'); expandedCardId=null; }
      else{ if(expandedCardId){ const p=document.getElementById('detail-'+expandedCardId); if(p)p.classList.remove('open'); }
        d.classList.add('open'); expandedCardId=service.id; updateDetail(service); }
    });
    return card;
  }

  function updateDetail(service){ const d=document.getElementById('detail-'+service.id); if(!d)return; const data=service.trendData; if(!data.length)return;
    const avg=Math.round(data.reduce((a,b)=>a+b,0)/data.length), mn=Math.round(Math.min(...data)), mx=Math.round(Math.max(...data)), jit=calcJitter(data).toFixed(1);
    d.querySelector('[data-field="jitter"]').textContent=jit+' ms';
    d.querySelector('[data-field="avg"]').textContent=avg+' ms';
    d.querySelector('[data-field="range"]').textContent=mx+' / '+mn+' ms'; }

  function renderList(){ listContainer.innerHTML='';
    services.forEach((s,i)=>listContainer.appendChild(renderCard(s,i)));
    const f=document.createElement('div'); f.className='list-footer';
    f.innerHTML='<div class="visit-stats">'+
      '<div class="visit-stat-item"><span class="visit-stat-num" id="visitTotal">--</span><span class="visit-stat-label">总访问量</span></div>'+
      '<div class="visit-stat-item"><span class="visit-stat-num" id="visitToday">--</span><span class="visit-stat-label">今日访问</span></div></div>'+
      '<div class="footer-divider"></div>'+
      '<div>共 '+services.length+' 个节点 · 真实HTTP并发测速</div>'+
      '<div style="margin-top:2px;">点击卡片查看详情 · GitHub 可跳转官网</div>';
    listContainer.appendChild(f); }

  async function updateData(){ if(isUpdating)return; isUpdating=true;
    try{ const results=await Promise.all(services.map(s=>measureLatency(s.testUrl)));
      for(let i=0;i<services.length;i++){ const s=services[i], r=results[i], old=s.latency;
        if(r!==null){ s.latency=r; s.failCount=0; s.trendData.push(r); if(s.trendData.length>DATA_POINTS)s.trendData.shift(); }
        else{ s.failCount++; if(s.failCount>=3)s.latency=null; }
        const nl=getLevel(s.latency), lc=nl!==s.level; s.level=nl;
        const card=listContainer.querySelector('[data-id="'+s.id+'"]');
        if(card){ if(s.trendData.length>=2){ const svg=card.querySelector('.trend-chart svg'); if(svg)svg.innerHTML=generateTrendSVG(s,DATA_POINTS-1,44); }
          const ve=card.querySelector('.latency-value'), ue=card.querySelector('.latency-unit');
          if(ve){ if(lc){ const c='latency-'+s.level; ve.className='latency-value '+c; if(ue)ue.className='latency-unit '+c; }
            if(s.latency!==null)animateNumber(ve,old,s.latency,200); else ve.textContent='--'; }
          if(expandedCardId===s.id)updateDetail(s); }
      }
    }catch(e){ console.error('测速异常:',e); } finally{ isUpdating=false; } }

  let toastTimer=null;
  function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2000); }

  renderList(); reportVisit(); showToast('开始测速...');
  updateData().then(()=>setInterval(updateData,UPDATE_INTERVAL));
})();
</script>
</body>
</html>
