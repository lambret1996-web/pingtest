<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
    <title>延迟测速面板</title>
    <!--引入独立样式文件-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-title">网页延迟测试工具</div>
<div class="card" id="mainCard">
    <div class="ip-bar">
        IP：<span id="clientIp"><strong>加载中...</strong></span>
        &nbsp;|&nbsp;位置：<span id="location"><strong>加载中...</strong></span>
        &nbsp;|&nbsp;运营商：<span id="isp"><strong>加载中...</strong></span>
    </div>

    <div class="add-row">
        <input id="siteName" placeholder="站点名称"/>
        <input id="siteUrl" placeholder="域名"/>
        <select id="siteTag">
            <option value="国内">国内</option>
            <option value="国际">国际</option>
        </select>
        <button id="addBtn">添加</button>
    </div>

    <div id="listWrap"></div>
</div>

<script>
let siteList = [
    {name:"和平精英",tag:"国内",url:"https://gp.qq.com/favicon.ico",icon:"https://gp.qq.com/favicon.ico"},
    {name:"Bilibili",tag:"国内",url:"https://www.bilibili.com/favicon.ico",icon:"https://www.bilibili.com/favicon.ico"},
    {name:"王者荣耀",tag:"国内",url:"https://pvp.qq.com/favicon.ico",icon:"https://pvp.qq.com/favicon.ico"},
    {name:"淘宝",tag:"国内",url:"https://www.taobao.com/favicon.ico",icon:"https://www.taobao.com/favicon.ico"},
    {name:"GitHub",tag:"国际",url:"https://github.com/favicon.ico",icon:"https://github.com/favicon.ico"},
    {name:"Telegram",tag:"国际",url:"https://telegram.org/favicon.ico",icon:"https://telegram.org/favicon.ico"},
    {name:"Cloudflare",tag:"国际",url:"https://www.cloudflare.com/favicon.ico",icon:"https://www.cloudflare.com/favicon.ico"},
    {name:"YouTube",tag:"国际",url:"https://www.youtube.com/favicon.ico",icon:"https://www.youtube.com/favicon.ico"},
    {name:"ChatGPT",tag:"国际",url:"https://chat.openai.com/favicon.ico",icon:"https://chat.openai.com/favicon.ico"},
    {name:"X(Twitter)",tag:"国际",url:"https://x.com/favicon.ico",icon:"https://x.com/favicon.ico"}
];

const listWrap = document.getElementById("listWrap");
const siteName = document.getElementById("siteName");
const siteUrl = document.getElementById("siteUrl");
const siteTag = document.getElementById("siteTag");
const addBtn = document.getElementById("addBtn");
const clientIpEl = document.getElementById("clientIp");
const locationEl = document.getElementById("location");
const ispEl = document.getElementById("isp");

//运营商名称简单翻译
function parseIsp(name){
    if(!name) return "未知";
    const low = name.toLowerCase();
    if(low.includes("mobile")) return "中国移动";
    if(low.includes("unicom")) return "中国联通";
    if(low.includes("telecom")) return "中国电信";
    if(low.includes("cernet")) return "教育网";
    return name;
}

(async function getIpInfo(){
  try{
    const res = await fetch("https://api.ip.sb/geoip");
    const json = await res.json();
    clientIpEl.innerText = json.ip;
    locationEl.innerText = `${json.country} ${json.city||""}`;
    ispEl.innerText = parseIsp(json.isp);
  }catch(e){
    clientIpEl.innerText = "获取失败";
    locationEl.innerText = "获取失败";
    ispEl.innerText = "获取失败";
  }
})();

// 预加载全部图标，缓存到内存，避免高频重渲染反复请求图片
const iconCache = {};
function preloadIcons(){
    siteList.forEach(site=>{
        if(!iconCache[site.icon]){
            const img = new Image();
            img.src = site.icon;
            iconCache[site.icon] = img;
        }
    })
}

function renderList(){
    listWrap.innerHTML = "";
    siteList.forEach((site,idx)=>{
        const tagClass = site.tag === "国内" ? "tag-cn":"tag-intl";
        listWrap.innerHTML += `
        <div class="item" data-idx="${idx}">
            <img class="icon-img" src="${site.icon}" crossorigin="anonymous" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🌐</text></svg>';this.onerror=null;">
            <div class="name" title="${site.name}">${site.name}</div>
            <div class="tag ${tagClass}">${site.tag}</div>
            <div class="ms" data-ms>--</div>
            <div class="dot-group" data-dot>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>`;
    });
}

async function testLatency(index,imgUrl){
    const itemDom = document.querySelector(`[data-idx="${index}"]`);
    if(!itemDom) return;

    const msDom = itemDom.querySelector("[data-ms]");
    const dots = itemDom.querySelectorAll(".dot");
    const startTime = performance.now();
    let cost = -1;

    return new Promise(resolve=>{
        const img = new Image();
        let timer = setTimeout(()=>{
            img.onload=null;
            img.onerror=null;
            cost = -1;
            render();
            resolve();
        },2500);

        img.onload = ()=>{
            clearTimeout(timer);
            cost = Math.round(performance.now() - startTime);
            render();
            resolve();
        };

        img.onerror = ()=>{
            clearTimeout(timer);
            cost = -1;
            render();
            resolve();
        };

        img.src = imgUrl + "?t="+Date.now();

        function render(){
            msDom.innerText = cost === -1 ? "-1ms" : `${cost}ms`;

            let activeDot = 0;
            let colorClass = "red";

            if(cost !== -1){
                if(cost < 80){
                    colorClass = "green";
                    activeDot = 8;
                }else if(cost <= 200){
                    colorClass = "yellow";
                    activeDot = Math.min(8, Math.ceil(cost / 25));
                }else{
                    colorClass = "red";
                    activeDot = Math.min(8, Math.ceil((cost - 200) / 50));
                }
            }

            dots.forEach((d,i)=>{
                d.className = i < activeDot ? `dot ${colorClass}` : "dot";
            });

            if(cost === -1){
                msDom.style.color = "#ef4444";
            }else if(cost < 80){
                msDom.style.color = "#22c55e";
            }else{
                msDom.style.color = "#f59e0b";
            }
        }
    });
}

async function batchPingAll(){
    const tasks = siteList.map((site,i)=> testLatency(i, site.url));
    await Promise.all(tasks);
    setTimeout(batchPingAll, 5);
}

addBtn.onclick = ()=>{
    const n = siteName.value.trim();
    const u = siteUrl.value.trim();
    const t = siteTag.value;
    if(!n || !u) return;
    const iconUrl = new URL("/favicon.ico",u).href;
    siteList.push({name:n, tag:t, url:u, icon:iconUrl});
    preloadIcons();
    siteName.value = "";
    siteUrl.value = "";
    renderList();
};

// 初始化
preloadIcons();
renderList();
batchPingAll();
</script>
</body>
</html>
