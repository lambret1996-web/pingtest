<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ping测试</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
    background:
        radial-gradient(circle at 12% 12%, rgba(126, 77, 255, 0.45), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.45), transparent 28%),
        linear-gradient(135deg, #0f172a 0%, #020617 45%, #0f172a 100%);
    min-height: 100vh;
    padding: 12px;
    color: #e2e8f0;
}
    .footer {
    text-align: center;
    margin-top: 24px;
    line-height: 1.8;
    font-size: 13px;
    background: linear-gradient(90deg, #ffffff, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding: 12px 8px;
    }
.page-title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(90deg, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
    letter-spacing: 1px;
}
.card {
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 22px;
    padding: 18px;
    max-width: 100%;
    margin: 0 auto;
    box-shadow:
        0 0 35px rgba(126, 77, 255, 0.22),
        0 0 55px rgba(56, 189, 248, 0.12);
    backdrop-filter: blur(18px);
}
.ip-bar {
    font-size: 14px;
    margin-bottom: 14px;
    color: #ffffff;
    line-height: 1.6;
    word-break: break-all;
    background: rgba(30, 64, 175, 0.22);
    border: 1px solid rgba(99, 102, 241, 0.35);
    border-radius: 14px;
    padding: 12px;
}

 .time-line {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 900;
    /* 时间 绿 → 白 文字渐变 */
    background: linear-gradient(90deg, #4ade80, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
 }
.add-row {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    margin-bottom: 14px;
    align-items: center;
}
input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.35);
    font-size: 15px;
    background: rgba(30, 64, 175, 0.18);
    color: #e2e8f0;
    outline: none;
}
input::placeholder {
    color: #64748b;
}
#siteName {
    width: 96px;
    flex-shrink: 0;
}
#siteUrl {
    flex: 1;
    min-width: 0;
}
select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.35);
    font-size: 15px;
    flex-shrink: 0;
    background: rgba(30, 64, 175, 0.18);
    color: #e2e8f0;
    outline: none;
}
button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 0 18px rgba(99, 102, 241, 0.45);
}
button:active {
    transform: scale(0.96);
}

/* 列宽分配 */
.table-header,
.item {
    display: grid;
    grid-template-columns: 1.9fr 1.1fr 1.1fr 1.1fr;
    align-items: center;
    width: 100%;
    gap: 8px;
}
.table-header {
    padding: 8px 4px 12px 4px;
    font-size: 15px;
    color: #94a3b8;
    font-weight: 700;
}
.item {
    padding: 14px 4px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
}
.item:last-child {
    border-bottom: none;
}

/* 网站名称（可点击跳转） */
.name {
    font-size: 16px;
    text-align: center
    ;
    font-weight: 600;
    color: #e2e8f0;
    white-space: normal;
    word-break: break-all;
    text-decoration: none;
    display: block;
    cursor: pointer;
}
.name:hover {
    color: #a78bfa;
}

/* 表头与单元格对齐 */
.h-name { text-align: center; padding-left: 8px; }
.h-tag, .h-ms, .h-loss { text-align: center; }
.c-tag, .c-ms, .c-loss { text-align: center; }

.tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}
.tag-cn {
    background: rgba(56, 189, 248, 0.18);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
}
.tag-int {
    background: rgba(167, 139, 250, 0.18);
    color: #a78bfa;
    border: 1px solid rgba(167, 139, 250, 0.35);
}
.ms {
    font-size: 16px;
    font-weight: 700;
}
.loss {
    font-size: 16px;
    font-weight: 600;
}
    .stat-line{
  margin-top:8px;
  font-size:13px;
  background: linear-gradient(90deg, #ffffff, #4ade80);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
        
    }
           /*HTML页面设置 */ 

    
</style>
   
</head>
<body>


    <div class="page-title">Ping全自动延迟测试</div>
<div class="card">
    <div class="ip-bar">
    <div>你当前的IP：<span id="clientIp">获取中</span></div>
    <div>ISP运营商：<span id="isp">获取中</span></div>
    <div>位置：<span id="location">获取中</span></div>
 
 <div class="time-line">当前北京时间：<span id="nowTime">--</span></div>
    </div>
    <div class="add-row">
        <input id="siteName" placeholder="站点名称">
        <input id="siteUrl" placeholder="域名/主页地址">
        <select id="siteTag">
            <option value="国内">国内</option>
            <option value="国际">国际</option>
        </select>
        <button id="addBtn">添加</button>
    </div>
    <div class="table-header">
        <div class="h-name">网站</div>
        <div class="h-tag">类型</div>
        <div class="h-ms">ping</div>
        <div class="h-loss">丢包率</div>
    </div>
    <div id="listWrap"></div>
</div>
    </div>
<footer class="footer">
    <div>🌐 网页延迟测试工具</div>
    <div>快速检测各站点网络连通质量，直观查看延迟与丢包情况</div>
    <div>支持自定义添加站点，全自动测速，全自动检测IP和ISP提供商</div>
    <div>✨ 挑选稳定优质线路，畅享流畅的网络体验✨</div>

<div class="stat-line">
总访问：<span id="totalVisit">--</span>｜今日访问：<span id="todayVisit">--</span>
    </div>
</footer>


    
<script>
// 同域名直接用相对路径即可
const STAT_API = "/visit";
const SAVE_API = "/save";

// 页面加载自动获取访问统计并显示
(async function loadVisitStat() {
  try {
    const res = await fetch(STAT_API);
    const data = await res.json();
    document.getElementById("totalVisit").textContent = data.total;
    document.getElementById("todayVisit").textContent = data.today;
  } catch (e) {
    console.log("访问统计加载失败", e);
  }
})();

// 测速完成后调用，自动筛选并保存优质线路
function saveGoodPing(name, url, ms, loss) {
  // 只保存延迟<200ms 且 丢包率为0的线路
  if (ms !== -1 && ms < 1000 && loss === 0) {
    fetch(SAVE_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name,
        testUrl: url,
        ms: ms,
        loss: loss
      })
    }).catch(e => console.log("上报失败", e));
  }
}
</script>
    

    
<script>//脚本设置

    // 站点列表：url=测速用图标地址，link=点击跳转地址
let siteList = [
    {name:"和平精英", tag:"国内", url:"https://gp.qq.com/favicon.ico", link:"https://gp.qq.com"},
  
    {name:"王者荣耀", tag:"国内", url:"https://pvp.qq.com/favicon.ico", link:"https://pvp.qq.com"},

   
    {name:"Bilibili", tag:"国内", url:"https://bilibili.com/favicon.ico", link:"https://bilibili.com"},

   
    {name:"抖音", tag:"国内", url:"https://douyin.com/favicon.ico", link:"https://douyin.com"},
  
    {name:"淘宝", tag:"国内", url:"https://www.taobao.com/favicon.ico", link:"https://www.taobao.com"},
    {name:"GitHub", tag:"国际", url:"https://github.com/favicon.ico", link:"https://github.com"},
    {name:"Telegram", tag:"国际", url:"https://telegram.org/favicon.ico", link:"https://telegram.org"},
    {name:"Cloudflare", tag:"国际", url:"https://www.cloudflare.com/favicon.ico", link:"https://www.cloudflare.com"},
    {name:"YouTube", tag:"国际", url:"https://i.ytimg.com/vi/jNQXAC9IVRw/default.jpg", link:"https://www.youtube.com"},
    {name:"ChatGPT", tag:"国际", url:"https://chat.openai.com/favicon.ico", link:"https://chat.openai.com"},
    {name:"X(Twitter)", tag:"国际", url:"https://x.com/favicon.ico", link:"https://x.com"}
];




const WINDOW_SEC = 180;
const siteSample = new Map();
const TEST_ROUND = 4;
const listWrap = document.getElementById("listWrap");
const siteName = document.getElementById("siteName");
const siteUrl = document.getElementById("siteUrl");
const siteTag = document.getElementById("siteTag");
const addBtn = document.getElementById("addBtn");

// IP信息获取
(async function getIpInfo() {
    try {
        const res = await fetch("https://api.ip.sb/geoip");
        const data = await res.json();
        document.getElementById("clientIp").textContent = data.ip;
        document.getElementById("location").textContent = `${data.country} ${data.city || ""}`;
        document.getElementById("isp").textContent = data.isp || "未知";
    } catch (e) {
        document.getElementById("clientIp").textContent = "获取失败";
        document.getElementById("location").textContent = "获取失败";
        document.getElementById("isp").textContent = "获取失败";
    }
})();
// 获取北京时间（东八区UTC+8，不受本机时区影响）
function updateBeijingTime(){
    const now = new Date();
    // 获取UTC时间毫秒，加上8小时偏移
    const beijingTs = now.getTime() + 8 * 3600 * 1000;
    const bj = new Date(beijingTs);

    const y = bj.getUTCFullYear();
    const m = String(bj.getUTCMonth()+1).padStart(2,'0');
    const d = String(bj.getUTCDate()).padStart(2,'0');
    const h = String(bj.getUTCHours()).padStart(2,'0');
    const mi = String(bj.getUTCMinutes()).padStart(2,'0');
    const s = String(bj.getUTCSeconds()).padStart(2,'0');

    document.getElementById("nowTime").innerText = `${y}-${m}-${d} ${h}:${mi}:${s}`;
}
updateBeijingTime();
setInterval(updateBeijingTime, 1000);
// 渲染列表
function renderList() {
    listWrap.innerHTML = "";
    siteList.forEach((site, idx) => {
        const tagClass = site.tag === "国内" ? "tag-cn" : "tag-int";
        listWrap.innerHTML += `
        <div class="item" data-idx="${idx}">
            <a class="name" href="${site.link}" target="_blank" rel="noopener noreferrer" title="${site.name}">${site.name}</a>
            <div class="c-tag"><span class="tag ${tagClass}">${site.tag}</span></div>
            <div class="c-ms"><span class="ms" data-ms>--</span></div>
            <div class="c-loss"><span class="loss" data-loss>--</span></div>
        </div>`;
    });
}

// 单次图片加载测速
async function singleTest(imgUrl) {
    return new Promise(resolve => {
        const img = new Image();
        let ok = false;
        const timer = setTimeout(() => {
            img.onload = null;
            img.onerror = null;
            resolve(ok);
        }, 2200);
        img.onload = () => {
            clearTimeout(timer);
            ok = true;
            resolve(ok);
        };
        img.onerror = () => {
            clearTimeout(timer);
            ok = false;
            resolve(ok);
        };
        img.src = imgUrl + "?t=" + Date.now() + "_" + Math.random();
    });
}

// 延迟测试主逻辑
async function testLatency(index, imgUrl) {
    const item = listWrap.querySelector(`[data-idx="${index}"]`);
    if (!item) return;
    const msDom = item.querySelector("[data-ms]");
    const lossDom = item.querySelector("[data-loss]");

    const start = performance.now();
    let latency = -1;
    let success = 0;

    for (let i = 0; i < TEST_ROUND; i++) {
        const ok = await singleTest(imgUrl);
        if (ok) success++;
    }

    const end = performance.now();
    if (success > 0) {
        latency = Math.round((end - start) / TEST_ROUND);
    }

    // 丢包率计算
    const lossRate = Math.round((1 - success / TEST_ROUND) * 100);

    msDom.textContent = latency === -1 ? "-1ms" : latency + "ms";
    lossDom.textContent = lossRate + "%";

    // 颜色状态
    if (latency === -1) {
        msDom.style.color = "#f87171";
    } else if (latency < 80) {
        msDom.style.color = "#4ade80";
    } else if (latency < 200) {
        msDom.style.color = "#facc15";
    } else {
        msDom.style.color = "#f87171";
    }

    if (lossRate === 0) {
        lossDom.style.color = "#4ade80";
    } else if (lossRate <= 30) {
        lossDom.style.color = "#facc15";
    } else {
        lossDom.style.color = "#f87171";
    }

    // 记录样本窗口
    if (!siteSample.has(index)) siteSample.set(index, []);
    const arr = siteSample.get(index);
    arr.push({ time: Date.now(), success });
    const expire = Date.now() - WINDOW_SEC * 1000;
    while (arr.length && arr[0].time < expire) arr.shift();
}

// 批量循环测速
async function batchPingAll() {
    const tasks = siteList.map((site, i) => testLatency(i, site.url));
    await Promise.all(tasks);
    setTimeout(batchPingAll, 10);
}

// 添加站点
addBtn.onclick = () => {
    const n = siteName.value.trim();
    let u = siteUrl.value.trim();
    const t = siteTag.value;
    if (!n || !u) return;

    let link = u;
    try {
        if (!/^https?:\/\//i.test(u)) {
            u = "https://" + u;
        }
        const urlObj = new URL(u);
        link = urlObj.origin;       // 跳转用主页
        u = urlObj.origin + "/favicon.ico"; // 测速用图标
    } catch (e) {}

    const newIdx = siteList.length;
    siteList.push({ name: n, tag: t, url: u, link: link });
    siteSample.set(newIdx, []);
    siteName.value = "";
    siteUrl.value = "";
    renderList();
};

// 初始化
renderList();
batchPingAll();
</script>
</body>
</html>
