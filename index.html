<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>延迟测速面板</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background:
        radial-gradient(circle at 12% 12%, rgba(126, 77, 255, 0.45), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(56, 189, 248, 0.45), transparent 28%),
        linear-gradient(135deg, #0f172a 0%, #020617 45%, #0f172a 100%);
    min-height: 100vh;
    padding: 12px;
    color: #e2e8f0;
}

.page-title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(90deg, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.card {
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 22px;
    padding: 18px;
    max-width: 100%;
    margin: 0 auto;
    box-shadow:
        0 0 35px rgba(126, 77, 255, 0.22),
        0 0 55px rgba(56, 189, 248, 0.12);
    backdrop-filter: blur(18px);
}

.ip-bar {
    font-size: 13px;
    margin-bottom: 14px;
    color: #94a3b8;
    line-height: 1.6;
    word-break: break-all;
    background: rgba(30, 64, 175, 0.22);
    border: 1px solid rgba(99, 102, 241, 0.35);
    border-radius: 14px;
    padding: 12px;
}

.add-row {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    margin-bottom: 14px;
    align-items: center;
}

input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.35);
    font-size: 15px;
    background: rgba(30, 64, 175, 0.18);
    color: #e2e8f0;
    outline: none;
}

input::placeholder {
    color: #64748b;
}

#siteName {
    width: 96px;
    flex-shrink: 0;
}

#siteUrl {
    flex: 1;
    min-width: 0;
}

select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.35);
    font-size: 15px;
    flex-shrink: 0;
    background: rgba(30, 64, 175, 0.18);
    color: #e2e8f0;
    outline: none;
}

button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 0 18px rgba(99, 102, 241, 0.45);
}

button:active {
    transform: scale(0.96);
}

/* 列宽分配：网站列加宽，其余三列收窄 */
.table-header,
.item {
    display: grid;
    grid-template-columns:1.5fr 1.3fr 1.1fr 1.1fr;
    align-items: center;
    width: 100%;
    gap: 8px;
}

.table-header {
    padding: 8px 4px 12px 4px;
    font-size: 15px;
    color: #94a3b8;
    font-weight: 700;
}

.item {
    padding: 14px 4px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
}

.item:last-child {
    border-bottom: none;
}

/* 删除图标，网站名称左对齐，完整显示名称，不再截断 */
.name {
    font-size: 16px;
    padding-left：6px;
    font-weight: 600;
    color: #e2e8f0;
    white-space: normal;
    word-break: break-all;
}

/* 表头与单元格对齐 */
.h-name { text-align: left; }
.h-tag, .h-ms, .h-loss { text-align: center; }
.c-tag, .c-ms, .c-loss { text-align: center; }

.tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.tag-cn {
    background: rgba(56, 189, 248, 0.18);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
}

.tag-intl {
    background: rgba(167, 139, 250, 0.18);
    color: #a78bfa;
    border: 1px solid rgba(167, 139, 250, 0.35);
}

.ms {
    font-size: 16px;
    font-weight: 700;
}

.loss {
    font-size: 16px;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="page-title">网页延迟测试工具</div>
<div class="card">
    <div class="ip-bar">
        IP：<span id="clientIp"></span> | 位置：<span id="location"></span> | 运营商：<span id="isp"></span>
    </div>
    <div class="add-row">
        <input id="siteName" placeholder="站点名称">
        <input id="siteUrl" placeholder="域名">
        <select id="siteTag">
            <option>国内</option>
            <option>国际</option>
        </select>
        <button id="addBtn">添加</button>
    </div>

    <div class="table-header">
        <div class="h-name">       网 站</div>
        <div class="h-tag">类型</div>
        <div class="h-ms">ping</div>
        <div class="h-loss">丢包率</div>
    </div>

    <div id="listWrap"></div>
</div>

<script>
let siteList = [
    {name:"和平精英",tag:"国内",url:"https://gp.qq.com/favicon.ico"},
    {name:"Bilibili",tag:"国内",url:"https://www.bilibili.com/favicon.ico"},
    {name:"王者荣耀",tag:"国内",url:"https://pvp.qq.com/favicon.ico"},
    {name:"淘宝",tag:"国内",url:"https://www.taobao.com/favicon.ico"},
    {name:"GitHub",tag:"国际",url:"https://github.com/favicon.ico"},
    {name:"Telegram",tag:"国际",url:"https://telegram.org/favicon.ico"},
    {name:"Cloudflare",tag:"国际",url:"https://www.cloudflare.com/favicon.ico"},
    {name:"YouTube",tag:"国际",url:"https://www.youtube.com/favicon.ico"},
    {name:"ChatGPT",tag:"国际",url:"https://chat.openai.com/favicon.ico"},
    {name:"X(Twitter)",tag:"国际",url:"https://x.com/favicon.ico"}
];

const WINDOW_SEC = 180;
const siteSample = new Map();
siteList.forEach((_, idx) => siteSample.set(idx, []));

const TEST_ROUND = 4;
const listWrap = document.getElementById("listWrap");
const siteName = document.getElementById("siteName");
const siteUrl = document.getElementById("siteUrl");
const siteTag = document.getElementById("siteTag");
const addBtn = document.getElementById("addBtn");

function parseIsp(name) {
    if (!name) return "未知";
    const low = name.toLowerCase();
    if (low.includes("mobile")) return "中国移动";
    if (low.includes("unicom")) return "中国联通";
    if (low.includes("telecom")) return "中国电信";
    if (low.includes("cernet")) return "教育网";
    return name;
}

(async function getIpInfo() {
    try {
        const res = await fetch("https://api.ip.sb/geoip");
        const json = await res.json();
        document.getElementById("clientIp").innerText = json.ip;
        document.getElementById("location").innerText = `${json.country} ${json.city || ""}`;
        document.getElementById("isp").innerText = parseIsp(json.isp);
    } catch (e) {
        document.getElementById("clientIp").innerText = "获取失败";
        document.getElementById("location").innerText = "获取失败";
        document.getElementById("isp").innerText = "获取失败";
    }
})();

function renderList() {
    listWrap.innerHTML = "";
    siteList.forEach((site, idx) => {
        const tagClass = site.tag === "国内" ? "tag-cn" : "tag-intl";
        listWrap.innerHTML += `
        <div class="item" data-idx="${idx}">
            <div class="name" title="${site.name}">${site.name}</div>
            <div class="c-tag"><span class="tag ${tagClass}">${site.tag}</span></div>
            <div class="c-ms"><span class="ms" data-ms>--</span></div>
            <div class="c-loss"><span class="loss" data-loss>--</span></div>
        </div>`;
    });
}

async function singleTest(imgUrl) {
    return new Promise(resolve => {
        const img = new Image();
        let ok = false;
        let timer = setTimeout(() => {
            img.onload = null;
            img.onerror = null;
            resolve(ok);
        }, 2200);
        img.onload = () => {
            clearTimeout(timer);
            ok = true;
            resolve(ok);
        };
        img.onerror = () => {
            clearTimeout(timer);
            ok = false;
            resolve(ok);
        };
        img.src = imgUrl + "?t=" + Date.now() + "_" + Math.random();
    });
}

async function testLatency(index, imgUrl) {
    const itemDom = document.querySelector(`[data-idx="${index}"]`);
    if (!itemDom) return;

    const msDom = itemDom.querySelector("[data-ms]");
    const lossDom = itemDom.querySelector("[data-loss]");
    const nowTs = Date.now();

    const startTime = performance.now();
    let latency = -1;
    await new Promise(resolve => {
        const img = new Image();
        let timer = setTimeout(() => {
            img.onload = null;
            img.onerror = null;
            latency = -1;
            resolve();
        }, 2200);
        img.onload = () => {
            clearTimeout(timer);
            latency = Math.round(performance.now() - startTime);
            resolve();
        };
        img.onerror = () => {
            clearTimeout(timer);
            latency = -1;
            resolve();
        };
        img.src = imgUrl + "?t=" + Date.now();
    });

    let success = 0;
    for (let i = 0; i < TEST_ROUND; i++) {
        const ok = await singleTest(imgUrl);
        success += ok ? 1 : 0;
    }

    const queue = siteSample.get(index);
    for (let i = 0; i < TEST_ROUND; i++) {
        queue.push({ ts: nowTs, ok: i < success });
    }

    const expire = nowTs - WINDOW_SEC * 1000;
    siteSample.set(index, queue.filter(s => s.ts >= expire));
    const validSamples = siteSample.get(index);

    const total = validSamples.length;
    const okCount = validSamples.filter(s => s.ok).length;
    const lossRate = total === 0 ? 0 : Math.round((1 - okCount / total) * 100);

    msDom.innerText = latency === -1 ? "-1ms" : `${latency}ms`;
    lossDom.innerText = `${lossRate}%`;

    if (latency === -1) {
        msDom.style.color = "#f87171";
    } else if (latency < 80) {
        msDom.style.color = "#4ade80";
    } else if (latency < 200) {
        msDom.style.color = "#fde047";
    } else {
        msDom.style.color = "#f87171";
    }

    if (lossRate === 0) {
        lossDom.style.color = "#4ade80";
    } else if (lossRate <= 30) {
        lossDom.style.color = "#fde047";
    } else {
        lossDom.style.color = "#f87171";
    }
}
//刷新时间ping
async function batchPingAll() {
    const tasks = siteList.map((site, i) => testLatency(i, site.url));
    await Promise.all(tasks);
    setTimeout(batchPingAll, 30);
}

addBtn.onclick = () => {
    const n = siteName.value.trim();
    let u = siteUrl.value.trim();
    const t = siteTag.value;
    if (!n || !u) return;
    // 自动补 https
    if(!u.startsWith('http')) u = 'https://' + u;
    const newIdx = siteList.length;
    siteList.push({ name: n, tag: t, url: u });
    siteSample.set(newIdx, []);
    siteName.value = "";
    siteUrl.value = "";
    renderList();
};

renderList();
batchPingAll();
</script>
</body>
</html>
